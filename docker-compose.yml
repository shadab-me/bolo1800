services:
  voicepanel:
    build: .
    container_name: voicepanel_app
    restart: always
    ports:
      - "80:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - ADMIN_PASSWORD=admin123
      - COST_PER_MIN=1.00
      - OVERAGE_RATE=1.00
      - OVERAGE_CAP_MIN=500
    volumes:
      - ./data:/app/data
