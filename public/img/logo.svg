<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <!-- Bolo1800 Full Horizontal Wordmark (4:1) -->
  <defs>
    <linearGradient id="bubble-grad-sm" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Left Mark (0-48) -->
  <g transform="translate(2, 2)">
    <!-- Speech bubble -->
    <path d="M22 4C11.5 4 4 11.2 4 20c0 4.9 2.4 9.2 6.2 12.1L8 39.5c-.2.8.6 1.4 1.4 1l7.6-4.6c1.6.3 3.3.5 5 .5 10.5 0 18-7.2 18-16S32.5 4 22 4z" fill="url(#bubble-grad-sm)"/>
    <!-- Phone handset in white -->
