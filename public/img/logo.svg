    <!-- Sound waves in orange #F97316 -->
    <path d="M26 12a6.5 6.5 0 0 1 5.8 5.8" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 8a10.5 10.5 0 0 1 9.5 9.5" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark Text -->
  <text x="56" y="32" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#0F172A">Bolo</tspan><tspan fill="#2563EB">1800</tspan>
  </text>
</svg>
