<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Minimal flat illustration of a smartphone on a desk with gentle blue ring waves -->
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="phone-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Desk surface ambient base -->
  <ellipse cx="400" cy="450" rx="320" ry="40" fill="#F1F5F9" opacity="0.6"/>

  <!-- Concentric gentle blue ring waves radiating outwards -->
  <circle cx="400" cy="300" r="240" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>
  <circle cx="400" cy="300" r="180" stroke="#93C5FD" stroke-width="2.5" opacity="0.7"/>
  <circle cx="400" cy="300" r="130" stroke="#3B82F6" stroke-width="3" opacity="0.8"/>

  <!-- Smartphone Body with Soft Drop Shadow -->
  <g filter="url(#card-shadow)">
    <!-- Phone Bezel / Frame -->
    <rect x="330" y="170" width="140" height="260" rx="28" fill="#0F172A"/>
    <!-- Screen -->
    <rect x="336" y="176" width="128" height="248" rx="22" fill="url(#phone-screen)"/>
    <!-- Top Speaker Ear Notch -->
    <rect x="382" y="186" width="36" height="4" rx="2" fill="#CBD5E1"/>
    
    <!-- Incoming Call / Pulse Icon on Screen -->
    <circle cx="400" cy="270" r="32" fill="#DBEAFE"/>
    <circle cx="400" cy="270" r="24" fill="#2563EB"/>
    
    <!-- Phone icon inside bubble -->
    <path d="M394 264c0-.8.6-1.5 1.5-1.5h1.2c.4 0 .8.3.9.7l.6 1.8c.2.4 0 .9-.3 1.2l-.7.6c.7 1.2 1.6 2.1 2.8 2.8l.6-.7c.3-.3.8-.5 1.2-.3l1.8.6c.4.1.7.5.7.9v1.2c0 .9-.7 1.6-1.6 1.6-4.5 0-8.2-3.7-8.2-8.2-.5-.7-.5-.7-.5-.7z" fill="#FFFFFF"/>

    <!-- Small acoustic orange wave on phone screen -->
    <path d="M407 259a4.5 4.5 0 0 1 3.5 3.5" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtle call standby indicators -->
    <rect x="365" y="325" width="70" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="380" y="342" width="40" height="6" rx="3" fill="#CBD5E1"/>

    <!-- Green Standby Pulse Dot -->
    <circle cx="400" cy="385" r="5" fill="#16A34A"/>
  </g>
</svg>
