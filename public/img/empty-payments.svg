<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Minimal flat illustration of a wallet with a small UPI-style QR card and a blue checkmark coin -->
  <defs>
    <filter id="payment-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="wallet-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="coin-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Ambient shadow base -->
  <ellipse cx="400" cy="460" rx="300" ry="36" fill="#F1F5F9" opacity="0.6"/>

  <g filter="url(#payment-shadow)">
    <!-- Emerging UPI QR Card -->
    <g transform="translate(320, 160) rotate(-4)">
      <rect x="0" y="0" width="160" height="110" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <!-- QR corner position markers -->
      <rect x="18" y="18" width="28" height="28" rx="6" fill="#2563EB"/>
      <rect x="23" y="23" width="18" height="18" rx="3" fill="#FFFFFF"/>
      <rect x="27" y="27" width="10" height="10" rx="2" fill="#2563EB"/>

      <rect x="114" y="18" width="28" height="28" rx="6" fill="#2563EB"/>
      <rect x="119" y="23" width="18" height="18" rx="3" fill="#FFFFFF"/>
      <rect x="123" y="27" width="10" height="10" rx="2" fill="#2563EB"/>

      <rect x="18" y="64" width="28" height="28" rx="6" fill="#2563EB"/>
      <rect x="23" y="69" width="18" height="18" rx="3" fill="#FFFFFF"/>
      <rect x="27" y="73" width="10" height="10" rx="2" fill="#2563EB"/>

      <!-- QR mock data modules -->
      <rect x="58" y="22" width="10" height="10" rx="2" fill="#94A3B8"/>
      <rect x="74" y="22" width="10" height="10" rx="2" fill="#0F172A"/>
      <rect x="90" y="22" width="10" height="10" rx="2" fill="#94A3B8"/>

      <rect x="58" y="38" width="10" height="10" rx="2" fill="#0F172A"/>
      <rect x="74" y="38" width="18" height="10" rx="2" fill="#F97316"/>
      <rect x="98" y="38" width="6" height="10" rx="2" fill="#0F172A"/>

      <rect x="58" y="54" width="18" height="10" rx="2" fill="#0F172A"/>
      <rect x="82" y="54" width="12" height="10" rx="2" fill="#94A3B8"/>

      <rect x="58" y="70" width="10" height="10" rx="2" fill="#94A3B8"/>
      <rect x="74" y="70" width="14" height="10" rx="2" fill="#0F172A"/>
      <rect x="94" y="70" width="16" height="10" rx="2" fill="#2563EB"/>
    </g>

    <!-- Wallet Back -->
    <rect x="270" y="230" width="260" height="180" rx="24" fill="#334155"/>

    <!-- Wallet Front Flap -->
    <path d="M260 260c0-13 11-24 24-24h212c13 0 24 11 24 24v120c0 13-11 24-24 24H284c-13 0-24-11-24-24V260z" fill="url(#wallet-body)"/>

    <!-- Wallet Front Card Pocket Stitching Line -->
    <path d="M260 300 Q400 330 520 300" stroke="#475569" stroke-width="2" stroke-dasharray="4 6" fill="none"/>

    <!-- Wallet Fastener Tab with Orange Accent -->
    <rect x="470" y="295" width="65" height="42" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <circle cx="510" cy="316" r="6" fill="#F97316"/>

    <!-- Blue Checkmark Coin Floating on Left -->
    <g transform="translate(240, 310)">
      <circle cx="45" cy="45" r="45" fill="url(#coin-grad)"/>
      <circle cx="45" cy="45" r="39" stroke="#93C5FD" stroke-width="2" fill="none" opacity="0.6"/>
      <!-- Crisp White Checkmark -->
      <path d="M32 45l9 9 19-19" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Small Sparkle Accents -->
    <path d="M540 220l3 9 9 3-9 3-3 9-3-9-9-3 9-3 3-9z" fill="#60A5FA" opacity="0.8"/>
    <path d="M230 250l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z" fill="#F97316" opacity="0.9"/>
  </g>
</svg>
