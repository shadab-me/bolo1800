<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <!-- Bolo1800 Logo Mark -->
  <!-- Ambient glow / shadow -->
  <defs>
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bubble-grad" x1="120" y1="120" x2="880" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <g filter="url(#mark-glow)">
    <!-- Speech bubble body -->
    <path d="M512 160C300 160 128 316 128 508c0 108 55 204 142 268L220 920c-5 18 14 33 30 23l170-103c30 8 62 12 92 12 212 0 384-156 384-344S724 160 512 160z" fill="url(#bubble-grad)"/>

    <!-- Crisp Phone Handset in White -->
    <path d="M352 384c0-26 21-48 48-48h32c14 0 25 9 29 22l18 60c4 13 0 26-10 35l-24 20c20 38 52 70 90 90l20-24c9-10 22-14 35-10l60 18c13 4 22 15 22 29v32c0 26-21 48-48 48-142 0-262-120-262-262v-10z" fill="#FFFFFF"/>

    <!-- Acoustic Sound Wave Arcs in Brand Orange #F97316 -->
    <path d="M600 320a136 136 0 0 1 120 120" stroke="#F97316" stroke-width="44" stroke-linecap="round"/>
    <path d="M600 230a226 226 0 0 1 200 200" stroke="#F97316" stroke-width="44" stroke-linecap="round"/>
  </g>
</svg>
